<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden | Polsterei Janssen</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE7;--ink:#221E19;--muted:#6B6154;--gold:#C1A033;--gold-d:#826418;--line:rgba(34,30,25,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Switzer',system-ui,sans-serif;
     font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;
     min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,64px)}
.box{max-width:560px;text-align:center}
.marke{display:inline-flex;align-items:center;gap:12px;margin-bottom:clamp(28px,5vw,44px)}
.marke img{height:46px;width:auto}
.nr{font-size:12px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-d)}
h1{margin-top:14px;font-size:clamp(30px,5.4vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.1}
p{margin-top:16px;font-size:clamp(15.5px,1.5vw,17.5px);color:var(--muted)}
.wege{margin-top:clamp(28px,4vw,40px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wege a{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border-radius:999px;
        border:1px solid var(--line);font-size:15.5px;font-weight:400;color:var(--ink);
        text-decoration:none;transition:background .25s,border-color .25s,color .25s}
.wege a:hover{background:var(--ink);border-color:var(--ink);color:#F7F3EC}
.wege a.haupt{background:var(--gold);border-color:var(--gold-d);color:var(--ink);font-weight:500}
.wege a.haupt:hover{background:var(--gold-d);color:#F7F3EC}
</style>
</head>
<body>
  <main class="box">
    <a class="marke" href="/" aria-label="Zur Startseite">
      <img src="/assets/logo-quer-gold.png" alt="Polsterei Janssen Raumdesign" width="1073" height="200">
    </a>
    <span class="nr">Fehler 404</span>
    <h1>Diese Seite gibt es nicht mehr.</h1>
    <p>Womöglich ein alter Link. Unsere Seite wurde neu gebaut, alles Wichtige
       finden Sie jetzt auf der Startseite.</p>
    <nav class="wege">
      <a class="haupt" href="/">Zur Startseite</a>
      <a href="/#leistungen">Leistungen</a>
      <a href="/#kontakt">Angebot anfragen</a>
      <a href="tel:+4921513512055">02151 351 20 55</a>
    </nav>
  </main>
</body>
</html>
